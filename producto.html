<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Producto — Asiderico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #ffe9e2;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #ffd6d6;
        }

        .product-img {
            width: 50%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            color: #b3004b;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 18px;
            font-weight: 800;
            color: #e6a172;
            margin-bottom: 20px;
        }

        .desc {
            font-size: 14px;
            color: #5a2a36;
            margin-bottom: 30px;
            white-space: normal;
            line-height: 1.5;
        }

        .order-btn {
            background: #e6a172;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            color: #fff;
            font-weight: 800;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            width: fit-content;
        }

        .order-btn img {
            width: 22px;
            height: 22px;
        }

        .volver {
            display: inline-block;
            margin-bottom: 20px;
            background: #e6a172;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
        }

        .future-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .future-item {
            background: #ffe9e2;
            border: 1px dashed #e6a172;
            border-radius: 10px;
            height: 120px;
        }
    </style>

    <script>
        const productos = {
            1: {
                nombre: "Cuadrados de Brownie", precio: 32, desc: `
Cuadrados de Brownies súper chocolatosos con nueces o sin ellas.<br>
Caja de cartón con 20 unidades de 4cm x 4cm.<br>
CONSULTAR POR BROWNIE ENTERO.<br>
El precio no incluye el envío.<br>
Los pedidos se realizan con 2 días de anticipación.
        `, img: "img/cuadrados de brownie.jpg"
            },

            2: {
                nombre: "Mini Frolas", precio: 16, desc: `
Mini Frolas de Membrillo, masa sablee con dulce de membrillo.<br>
8 unidades de 5 cm cada una.<br>
Los pedidos se realizan con 2 días de anticipación.
        `, img: "img/pastafrola de membrillo.png"
            },

            3: {
                nombre: "Alfajores de Maicena", precio: 18, desc: `
Alfajores de Maicena que se deshacen en la boca.<br>
Rellenos de dulce de leche y cubiertos con coco rallado.<br>
12 unidades.
        `, img: "img/alfajores de maicena.png"
            },

            4: {
                nombre: "Tarta de Cumpleaños", precio: 60, desc: `
Bizcocho de vainilla o chocolate.<br>
Cubierta con Buttercream o Ganache.<br>
1 relleno (consultar por 2 rellenos).<br>
Tarta de 20 cm y 1.8 kg.<br>
Pedidos con 4 días de anticipación.
        `, img: "img/tartas de cumple.jpg"
            },

            5: {
                nombre: "Chocotorta", precio: 25, desc: `
Tarta tradicional argentina con galletitas de chocolate y mousse de dulce de leche.<br>
16 cm — 25€<br>
20 cm — 30€<br>
Pedidos con 4 días de anticipación.
        `, img: "img/chocotorta.png"
            },

            6: {
                nombre: "Pastel Primavera", precio: 34, desc: `
Bizcocho de vainilla con crema y frutas de estación.<br>
Decorado con Buttercream o mousse.<br>
16 cm — 10/12 personas.<br>
Pedidos con 2 días de anticipación.
        `, img: "img/pastel primavera.png"
            },

            7: {
                nombre: "Cuadrados de Limón", precio: 20, desc: `
Lemonies cítricos con glacé por arriba.<br>
12 unidades de 4x4 cm.<br>
Pedidos con 48 hs de anticipación.
        `, img: "img/cuadrados de limon.png"
            },

            8: {
                nombre: "Mini Cakes", precio: 15, desc: `
Mini tarta con forma de porción.<br>
Rellena de crema Chantillí o Buttercream.<br>
Decorada con flores.<br>
Pedidos con 2 días de anticipación.
        `, img: "img/mini cakes.png"
            },

            9: {
                nombre: "Torta Rogel", precio: 29, desc: `
Capas finas de masa con dulce de leche.<br>
Merengue italiano por arriba.<br>
18 cm de diámetro.<br>
Pedidos con 1 día de anticipación.
        `, img: "img/torta rogel.png"
            },

            10: {
                nombre: "Torta Vintage", precio: 48, desc: `
Bizcocho de vainilla o chocolate.<br>
Buttercream o Ganache.<br>
Decoración retro personalizada.<br>
18 cm — 1.2 kg.<br>
Pedidos con 4 días de anticipación.
        `, img: "img/torta vintage.png"
            },

            11: {
                nombre: "Cheesecake", precio: 24, desc: `
Base de galletitas con crema de queso.<br>
Decorada con mermelada y frutos rojos.<br>
16 cm — 16€<br>
20 cm — 30€<br>
Pedidos con 2 días de anticipación.
        `, img: "img/chessecake con frutos rojos.png"
            },

            12: {
                nombre: "Tarta Brownie XL", precio: 45, desc: `
Brownie con nueces.<br>
Decorado con nata, frutas o chocolates.<br>
22 cm de diámetro.<br>
Pedidos con 2 días de anticipación.
        `, img: "img/tarta brownie.png"
            },

            13: {
                nombre: "Mix de Alfajores", precio: 22, desc: `
Incluye:<br>
• 4 Alfajores de Maicena<br>
• 3 Mini alfajores bañados en chocolate<br>
• 3 Mini alfajores de coco<br>
• 2 Alfajores Cookie
        `, img: "img/mix de alfajores.png"
            },

            14: {
                nombre: "Lemon Pie", precio: 28, desc: `
Masa sablée de vainilla.<br>
Relleno de Lemon Curd.<br>
Decorado con merengue italiano.<br>
22 cm de diámetro.
        `, img: "img/Lemon pie.png"
            },

            15: {
                nombre: "Cookies Artesanales", precio: 12, desc: `
Galletas de mantequilla de vainilla o chocolate.<br>
Muchos sabores disponibles.<br>
Precio por unidad — mínimo 4 unidades.<br>
Pedidos con 2 días de anticipación.
        `, img: "img/cookies artesanales.png"
            },

            16: {
                nombre: "Tartas Personalizadas", precio: 32, desc: `
Bizcocho de vainilla o chocolate.<br>
Buttercream o Ganache.<br>
Precio por kg — mínimo 2 kg.<br>
Pedidos con 5 días de anticipación.
        `, img: "img/tartas personalizadas.png"
            },

            17: {
                nombre: "Carrot Cake", precio: 30, desc: `
Tarta de zanahoria con frosting de queso.<br>
Decorada con nueces.<br>
20 cm de diámetro.<br>
Pedidos con 3 días de anticipación.
        `, img: "img/Carrot cake.png"
            }
        };

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            const p = productos[id];

            if (!p) {
                document.body.innerHTML = "<h1 style='color:#b3004b;text-align:center;'>Producto no encontrado</h1>";
                return;
            }

            document.getElementById("p-img").src = p.img;
            document.getElementById("p-name").innerText = p.nombre;
            document.getElementById("p-price").innerText = "€" + p.precio;
            document.getElementById("p-desc").innerHTML = p.desc;
        };
    </script>

</head>

<body>

    <a href="index.html#productos" style="display:inline-block;margin-bottom:20px;background:#e6a172;color:#fff;
          padding:10px 16px;border-radius:8px;font-weight:800;text-decoration:none;">
        ← Volver a productos
    </a>

    <div class="container">
        <img id="p-img" class="product-img">

        <h1 id="p-name"></h1>

        <div class="price" id="p-price"></div>

        <div class="desc" id="p-desc"></div>

        <button class="order-btn">
            <img src="img/carro de compras.png">
            Agregar al carrito
        </button>

        <div class="future-grid">
            <div class="future-item"></div>
            <div class="future-item"></div>
            <div class="future-item"></div>
        </div>
    </div>

</body>

</html>
