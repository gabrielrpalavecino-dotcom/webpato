<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: 'Segoe UI', Arial;
            margin: 0;
            padding: 20px;
            background: linear-gradient(180deg, #f2b38f, #ffe7d6);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ffd6d6;
        }

        img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        h1 {
            color: #b3004b;
            margin-bottom: 10px;
        }

        p {
            color: #5a2a36;
            font-size: 15px;
            line-height: 1.4;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            background: #e91e63;
            color: white;
            border-radius: 10px;
            font-weight: 800;
            text-decoration: none;
            margin-top: 20px;
        }
    </style>

    <script>
        // Base de datos de productos
        const productos = {
            "brownie": {
                nombre: "Tarta Brownie",
                precio: 32,
                desc: "Brownie húmedo con base crocante y cobertura de chocolate.",
                img: "img/tarta brownie.png"
            },
            "frolas": {
                nombre: "Mini Frolas",
                precio: 16,
                desc: "Masa casera con dulce de membrillo, textura hojaldrada.",
                img: "img/pastafrola de membrillo.png"
            },
            "maicena": {
                nombre: "Alfajores de Maicena",
                precio: 18,
                desc: "Clásicos con dulce de leche y coco rallado.",
                img: "img/alfajores de maicena.png"
            }
            // 👉 Aquí agregás todos los demás productos
        };

        // Obtener ID desde la URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const p = productos[id];

        window.onload = () => {
            if (!p) {
                document.body.innerHTML = "<h1>Producto no encontrado</h1>";
                return;
            }

            document.getElementById("img").src = p.img;
            document.getElementById("nombre").innerText = p.nombre;
            document.getElementById("desc").innerText = p.desc;
            document.getElementById("precio").innerText = "€" + p.precio;

            document.getElementById("whatsapp").href =
                "https://wa.me/34622403795?text=Hola! Quiero pedir " + p.nombre + " por €" + p.precio;
        };
    </script>

</head>

<body>

    <div class="container">
        <img id="img" src="">
        <h1 id="nombre"></h1>
        <p id="desc"></p>
        <h2 id="precio" style="color:#b3004b;"></h2>

        <a id="whatsapp" class="btn" target="_blank">Pedir por WhatsApp</a>
    </div>

</body>

</html>
